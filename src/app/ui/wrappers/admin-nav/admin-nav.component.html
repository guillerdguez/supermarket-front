@if (user()) {
  <nav class="admin-nav">
    <a
      class="brand"
      [routerLink]="isAdmin() ? '/admin/dashboard' : '/cashier/dashboard'"
    >
      <i class="pi pi-shop" aria-hidden="true"></i>
      Supermarket POS
    </a>

    <div class="nav-menus">
      @if (isAdmin()) {
        <p-menubar [model]="adminItems" styleClass="pos-menubar" />
      }
      @if (isCashier()) {
        <p-menubar [model]="cashierItems" styleClass="pos-menubar" />
      }
    </div>

    <div class="nav-right">
      <app-notifications-bell />

      <a
        routerLink="/account"
        class="profile-link"
        title="Perfil"
        aria-label="Perfil"
      >
        <i class="pi pi-user" aria-hidden="true"></i>
        <span class="name">{{ user()?.firstName || user()?.username }}</span>
        <span class="role">{{ user()?.role }}</span>
      </a>

      <button
        type="button"
        class="logout"
        (click)="logout()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
}
