<pos-page-shell>
  <header class="page-header">
    <div class="page-header__text">
      <a routerLink="/profile" class="back-link">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Volver al perfil
      </a>
      <h1>Cambiar contraseña</h1>
    </div>
  </header>

  <pos-panel title="Seguridad de la cuenta">
    <form class="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-scroll">
        <div class="form-grid">
          <div class="field field--full">
            <label for="current">Contraseña actual <span class="req">*</span></label>
            <input
              id="current"
              type="password"
              name="current"
              [(ngModel)]="currentPassword"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="field field--full">
            <label for="new">Nueva contraseña <span class="req">*</span></label>
            <input
              id="new"
              type="password"
              name="new"
              [ngModel]="newPassword()"
              (ngModelChange)="onNewPasswordChange($event)"
              required
              autocomplete="new-password"
            />
            <ul class="rules" aria-live="polite">
              <li [class.ok]="rules().minLength">
                <i class="pi" [class.pi-check]="rules().minLength" [class.pi-circle]="!rules().minLength"></i>
                Mínimo 8 caracteres
              </li>
              <li [class.ok]="rules().hasUpperCase">
                <i class="pi" [class.pi-check]="rules().hasUpperCase" [class.pi-circle]="!rules().hasUpperCase"></i>
                Una mayúscula
              </li>
              <li [class.ok]="rules().hasNumber">
                <i class="pi" [class.pi-check]="rules().hasNumber" [class.pi-circle]="!rules().hasNumber"></i>
                Un número
              </li>
              <li [class.ok]="rules().hasSpecialChar">
                <i class="pi" [class.pi-check]="rules().hasSpecialChar" [class.pi-circle]="!rules().hasSpecialChar"></i>
                Un carácter especial
              </li>
            </ul>
          </div>

          <div class="field field--full">
            <label for="confirm">Confirmar <span class="req">*</span></label>
            <input
              id="confirm"
              type="password"
              name="confirm"
              [(ngModel)]="confirmPassword"
              required
              autocomplete="new-password"
            />
            @if (mismatch()) {
              <p class="field-error">Las contraseñas no coinciden</p>
            }
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/profile" pButton label="Cancelar" severity="secondary" [outlined]="true"></a>
        <button
          type="submit"
          pButton
          [label]="loading() ? 'Guardando…' : 'Cambiar contraseña'"
          [loading]="loading()"
          [disabled]="loading() || !currentPassword || !isPasswordValid() || !confirmPassword"
        ></button>
      </div>
    </form>
  </pos-panel>
</pos-page-shell>
