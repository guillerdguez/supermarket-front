<pos-page-shell>
  <header class="page-header">
    <div class="page-header__text">
      <a routerLink="/cashier/transfers" class="back-link">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Volver a mis transferencias
      </a>
      <h1>Solicitar stock</h1>
    </div>
  </header>

  <pos-panel title="Datos de la solicitud">
    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-scroll">
        <div class="form-grid">
          <div class="field" [class.has-error]="form.controls.productId.invalid && form.controls.productId.touched">
            <label for="p">Producto <span class="req">*</span></label>
            <p-select
              id="p"
              [options]="productList()"
              optionLabel="name"
              optionValue="id"
              formControlName="productId"
              placeholder="Seleccionar…"
              styleClass="w-full"
              [attr.aria-invalid]="form.controls.productId.invalid && form.controls.productId.touched"
              [attr.aria-describedby]="form.controls.productId.invalid && form.controls.productId.touched ? 'p-error' : null"
            />
            <app-field-error id="p-error" [message]="fieldError(form.controls.productId, { required: 'El producto es obligatorio' })" />
          </div>
          <div class="field" [class.has-error]="form.controls.quantity.invalid && form.controls.quantity.touched">
            <label for="q">Cantidad <span class="req">*</span></label>
            <input
              id="q"
              formControlName="quantity"
              type="number"
              min="1"
              [attr.aria-invalid]="form.controls.quantity.invalid && form.controls.quantity.touched"
              [attr.aria-describedby]="form.controls.quantity.invalid && form.controls.quantity.touched ? 'q-error' : null"
            />
            <app-field-error id="q-error" [message]="fieldError(form.controls.quantity, { required: 'La cantidad es obligatoria', min: 'La cantidad debe ser al menos 1' })" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a
          routerLink="/cashier/transfers"
          pButton
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
        ></a>
        <button
          type="submit"
          pButton
          [label]="loading() ? 'Enviando…' : 'Solicitar'"
          [loading]="loading()"
          [disabled]="loading()"
        ></button>
      </div>
    </form>
  </pos-panel>
</pos-page-shell>
