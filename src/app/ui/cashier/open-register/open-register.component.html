<pos-page-shell>
  <header class="page-header">
    <div class="page-header__text">
      <a routerLink="/cashier/dashboard" class="back-link">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Volver al dashboard
      </a>
      <h1>Abrir caja</h1>
    </div>
  </header>

  <pos-panel title="Datos de apertura">
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-scroll">
        <div class="form-grid">
          @if (assignedBranchId() !== null) {
            <div class="field">
              <label for="branchName">Sucursal</label>
              <input id="branchName" [value]="assignedBranchName() || '—'" disabled />
              <span class="field-hint">Sucursal asignada a tu usuario</span>
            </div>
          } @else {
            <div class="field" [class.has-error]="form.controls.branchId.invalid && form.controls.branchId.touched">
              <label for="branchId">Sucursal <span class="req">*</span></label>
              <p-select
                id="branchId"
                [options]="branchList()"
                optionLabel="name"
                optionValue="id"
                formControlName="branchId"
                placeholder="Seleccionar…"
                styleClass="w-full"
                [attr.aria-invalid]="form.controls.branchId.invalid && form.controls.branchId.touched"
                [attr.aria-describedby]="form.controls.branchId.invalid && form.controls.branchId.touched ? 'branchId-error' : null"
              />
              <app-field-error id="branchId-error" [message]="fieldError(form.controls.branchId, { required: 'La sucursal es obligatoria' })" />
            </div>
          }
          <div class="field" [class.has-error]="form.controls.openingBalance.invalid && form.controls.openingBalance.touched">
            <label for="openingBalance">Saldo inicial <span class="req">*</span></label>
            <input
              id="openingBalance"
              formControlName="openingBalance"
              type="number"
              min="0"
              step="0.01"
              [attr.aria-invalid]="form.controls.openingBalance.invalid && form.controls.openingBalance.touched"
              [attr.aria-describedby]="form.controls.openingBalance.invalid && form.controls.openingBalance.touched ? 'openingBalance-error' : null"
            />
            <app-field-error id="openingBalance-error" [message]="fieldError(form.controls.openingBalance, { required: 'El saldo inicial es obligatorio', min: 'El saldo inicial no puede ser negativo' })" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/cashier/dashboard" pButton label="Cancelar" severity="secondary" [outlined]="true"></a>
        <button
          type="submit"
          pButton
          [label]="loading() ? 'Abriendo…' : 'Abrir caja'"
          [loading]="loading()"
          [disabled]="loading()"
        ></button>
      </div>
    </form>
  </pos-panel>
</pos-page-shell>
