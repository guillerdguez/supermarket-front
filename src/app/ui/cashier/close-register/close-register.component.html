<pos-page-shell>
  <header class="page-header">
    <div class="page-header__text">
      <a routerLink="/pos" class="back-link">
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
        Volver a cobrar
      </a>
      <h1>Cerrar caja</h1>
    </div>
  </header>

  <pos-panel title="Datos de cierre">
    @if (current(); as reg) {
      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-scroll">
          <div class="pos-detail-grid">
            <span class="label">Caja</span>
            <span class="value">#{{ reg.id }}</span>
            <span class="label">Saldo apertura</span>
            <span class="value">{{ reg.openingBalance | currency: "EUR":"symbol":"1.2-2" }}</span>
          </div>

          <div class="form-grid">
            <div class="field field--full" [class.has-error]="form.controls.closingBalance.invalid && form.controls.closingBalance.touched">
              <label for="closing">Saldo de cierre <span class="req">*</span></label>
              <input
                id="closing"
                formControlName="closingBalance"
                type="number"
                min="0"
                step="0.01"
                [attr.aria-invalid]="form.controls.closingBalance.invalid && form.controls.closingBalance.touched"
                [attr.aria-describedby]="form.controls.closingBalance.invalid && form.controls.closingBalance.touched ? 'closing-error' : null"
              />
              <app-field-error id="closing-error" [message]="fieldError(form.controls.closingBalance, { required: 'El saldo de cierre es obligatorio', min: 'El saldo de cierre no puede ser negativo' })" />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a routerLink="/pos" pButton label="Cancelar" severity="secondary" [outlined]="true"></a>
          <button
            type="submit"
            pButton
            [label]="loading() ? 'Cerrando…' : 'Cerrar caja'"
            [loading]="loading()"
            [disabled]="loading()"
          ></button>
        </div>
      </form>
    } @else {
      <p class="muted">No hay caja abierta.</p>
    }
  </pos-panel>
</pos-page-shell>
