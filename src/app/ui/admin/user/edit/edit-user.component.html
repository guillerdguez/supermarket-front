<pos-page-shell [class.preview-mode]="isPreview">
  <header class="page-header">
    <div class="page-header__text">
      @if (!isPreview) {
        <a routerLink="/admin/users" class="back-link">
          <i class="pi pi-arrow-left" aria-hidden="true"></i>
          Volver a usuarios
        </a>
      }
      <h1>Editar usuario</h1>
    </div>
  </header>

  <pos-panel title="Datos del usuario">
    @if (ready()) {
      <form class="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-scroll">
          <div class="form-grid">
            <div class="field">
              <label for="u">Usuario <span class="req">*</span></label>
              <input id="u" name="u" [(ngModel)]="form.username" required />
            </div>
            <div class="field">
              <label for="e">Email <span class="req">*</span></label>
              <input
                id="e"
                name="e"
                type="email"
                [(ngModel)]="form.email"
                required
              />
            </div>

            <div class="field">
              <label for="f">Nombre <span class="req">*</span></label>
              <input id="f" name="f" [(ngModel)]="form.firstName" required />
            </div>
            <div class="field">
              <label for="l">Apellido <span class="req">*</span></label>
              <input id="l" name="l" [(ngModel)]="form.lastName" required />
            </div>

            <div class="field">
              <label for="r">Rol</label>
              <p-select
                id="r"
                [options]="roleOptions"
                optionLabel="label"
                optionValue="value"
                [(ngModel)]="form.role"
                name="r"
                styleClass="w-full"
              />
            </div>
            <div class="field">
              <label for="b">Sucursal</label>
              <p-select
                id="b"
                [options]="branchList()"
                optionLabel="name"
                optionValue="id"
                [(ngModel)]="form.branchId"
                name="b"
                placeholder="— Sin sucursal —"
                styleClass="w-full"
                [showClear]="true"
              />
              <span class="field-hint"
                >Obligatoria para cajeros: es la caja que podrán abrir.</span
              >
            </div>
          </div>
        </div>

        <div class="form-actions">
          @if (!isPreview) {
            <a
              routerLink="/admin/users"
              pButton
              label="Cancelar"
              severity="secondary"
              [outlined]="true"
            ></a>
          } @else {
            <button
              type="button"
              pButton
              label="Salir"
              severity="secondary"
              [outlined]="true"
              (click)="closePreview()"
            ></button>
          }
          <button
            type="submit"
            pButton
            [label]="loading() ? 'Guardando…' : 'Guardar cambios'"
            [loading]="loading()"
            [disabled]="loading()"
          ></button>
        </div>
      </form>
    } @else {
      <div class="skeleton-form" aria-hidden="true">
        @for (row of [1, 2, 3, 4, 5]; track row) {
          <div class="skeleton-field">
            <span class="skeleton-label"></span>
            <span class="skeleton-input"></span>
          </div>
        }
      </div>
    }
  </pos-panel>
</pos-page-shell>
