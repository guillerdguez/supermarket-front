<pos-page-shell [class.preview-mode]="isPreview">
  <header class="page-header">
    <div class="page-header__text">
      @if (!isPreview) {
        <a routerLink="/admin/branches" class="back-link">
          <i class="pi pi-arrow-left" aria-hidden="true"></i>
          Volver a sucursales
        </a>
      }
      <h1>{{ isEdit ? "Editar sucursal" : "Nueva sucursal" }}</h1>
    </div>
  </header>

  <pos-panel title="Datos de la sucursal">
    @if (ready()) {
      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-scroll">
          <div class="form-grid">
            <div class="field" [class.has-error]="form.controls.name.invalid && form.controls.name.touched">
              <label for="name">Nombre <span class="req">*</span></label>
              <input
                id="name"
                formControlName="name"
                placeholder="Ej. Sucursal Centro"
                [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched"
                [attr.aria-describedby]="form.controls.name.invalid && form.controls.name.touched ? 'name-error' : null"
              />
              <app-field-error id="name-error" [message]="fieldError(form.controls.name, { required: 'El nombre es obligatorio' })" />
            </div>
            <div class="field" [class.has-error]="form.controls.address.invalid && form.controls.address.touched">
              <label for="address">Dirección <span class="req">*</span></label>
              <input
                id="address"
                formControlName="address"
                placeholder="Calle y número"
                [attr.aria-invalid]="form.controls.address.invalid && form.controls.address.touched"
                [attr.aria-describedby]="form.controls.address.invalid && form.controls.address.touched ? 'address-error' : null"
              />
              <app-field-error id="address-error" [message]="fieldError(form.controls.address, { required: 'La dirección es obligatoria' })" />
            </div>
            <div class="field field--full">
              <label class="checkbox">
                <input
                  type="checkbox"
                  formControlName="isWarehouse"
                />
                Es almacén
              </label>
            </div>
          </div>
        </div>

        <div class="form-actions">
          @if (!isPreview) {
            <a
              routerLink="/admin/branches"
              pButton
              label="Cancelar"
              severity="secondary"
              [outlined]="true"
            ></a>
          } @else {
            <button
              type="button"
              pButton
              label="Salir"
              severity="secondary"
              [outlined]="true"
              (click)="closePreview()"
            ></button>
          }
          <button
            type="submit"
            pButton
            [label]="loading() ? (isEdit ? 'Guardando…' : 'Creando…') : (isEdit ? 'Guardar cambios' : 'Crear sucursal')"
            [loading]="loading()"
            [disabled]="loading()"
          ></button>
        </div>
      </form>
    } @else {
      <div class="skeleton-form" aria-hidden="true">
        @for (row of [1, 2, 3]; track row) {
          <div class="skeleton-field">
            <span class="skeleton-label"></span>
            <span class="skeleton-input"></span>
          </div>
        }
      </div>
    }
  </pos-panel>
</pos-page-shell>
