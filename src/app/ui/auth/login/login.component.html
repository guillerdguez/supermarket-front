<div class="login-page">
  <div class="login-card">
    <div class="logo-mark">
      <i class="pi pi-shop"></i>
    </div>
    <h1>Supermarket POS</h1>
    <p class="muted">Inicia sesión para continuar</p>

    <form (ngSubmit)="onSubmit()" class="form">
      <label for="email">Email *</label>
      <input
        id="email"
        pInputText
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="admin@supermercado.com"
        autocomplete="username"
        [class.ng-invalid]="submitted() && !email.trim()"
      />
      @if (submitted() && !email.trim()) {
        <small class="field-error">El email es obligatorio</small>
      }

      <label for="password">Contraseña *</label>
      <p-password
        id="password"
        [(ngModel)]="password"
        name="password"
        placeholder="••••••••"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
      />
      @if (submitted() && !password) {
        <small class="field-error">La contraseña es obligatoria</small>
      }

      <button
        pButton
        type="submit"
        [label]="loading() ? 'Entrando…' : 'Entrar'"
        [loading]="loading()"
        [disabled]="loading()"
        class="submit-btn"
      ></button>
    </form>
  </div>
</div>
