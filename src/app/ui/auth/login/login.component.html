<div class="login-page">
  <div class="login-card">
    <div class="logo-mark">
      <i class="pi pi-shop"></i>
    </div>
    <h1>Supermarket POS</h1>
    <p class="muted">Inicia sesión para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <label for="email">Email *</label>
      <input
        id="email"
        pInputText
        type="email"
        formControlName="email"
        placeholder="admin@supermercado.com"
        autocomplete="username"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        [attr.aria-describedby]="form.controls.email.invalid && form.controls.email.touched ? 'email-error' : null"
      />
      <app-field-error id="email-error" [message]="fieldError(form.controls.email, { required: 'El email es obligatorio', email: 'Introduce un email válido' })" />

      <label for="password">Contraseña *</label>
      <p-password
        id="password"
        formControlName="password"
        placeholder="••••••••"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        [attr.aria-describedby]="form.controls.password.invalid && form.controls.password.touched ? 'password-error' : null"
      />
      <app-field-error id="password-error" [message]="fieldError(form.controls.password, { required: 'La contraseña es obligatoria' })" />

      <button
        pButton
        type="submit"
        [label]="loading() ? 'Entrando…' : 'Entrar'"
        [loading]="loading()"
        [disabled]="loading()"
        class="submit-btn"
      ></button>
    </form>

    <div class="demo-box">
      <p class="demo-box__title">Credenciales de prueba</p>
      <div class="demo-box__row">
        <span><strong>Admin:</strong> admin&#64;supermarket.com / password</span>
        <button
          pButton
          type="button"
          label="Usar"
          class="p-button-text p-button-sm"
          (click)="fillDemo('admin')"
        ></button>
      </div>
      <div class="demo-box__row">
        <span><strong>Cajero:</strong> cashier&#64;supermarket.com / password</span>
        <button
          pButton
          type="button"
          label="Usar"
          class="p-button-text p-button-sm"
          (click)="fillDemo('cashier')"
        ></button>
      </div>
    </div>
  </div>
</div>
